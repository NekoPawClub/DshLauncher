name: CI

# 仅当影响编译/测试的文件变更时触发；纯文档改动 (README/AGENTS 等) 跳过 CI
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'icons/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'icons/**'
      - '.github/workflows/ci.yml'

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (含 rustfmt 与 clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy (警告即失败)
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test

  # 两步编译发布：先用上一发布版本号编译并对比产物 hash，
  # 一致 (如仅注释改动) 则不发布；有变化才用当日版本号重编译并发布
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 定位上一发布版本并下载其产物
        shell: pwsh
        run: |
          $prevTag = (gh release list --limit 1 --json tagName --jq '.[0].tagName') 2>$null
          if ([string]::IsNullOrEmpty($prevTag)) {
            Write-Host "无历史发布：跳过产物对比，直接进入发布流程"
            "PREV_TAG=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PREV_HASH=none" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          Write-Host "上一发布: $prevTag"
          "PREV_TAG=$prevTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PREV_VER=$($prevTag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          gh release download $prevTag --pattern 'DshLauncher.exe' --dir prev
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'prev/DshLauncher.exe')) {
            Write-Host "上一发布产物获取失败：视为有变化，直接进入发布流程"
            "PREV_HASH=none" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          $h = (Get-FileHash 'prev/DshLauncher.exe' -Algorithm SHA256).Hash
          Write-Host "上一发布产物 SHA256: $h"
          "PREV_HASH=$h" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 第一步编译 (沿用上一发布版本号，产物用于 hash 对比)
        if: env.PREV_HASH != 'none'
        env:
          DSHLAUNCHER_VERSION: ${{ env.PREV_VER }}
        run: cargo build --release

      - name: 对比产物 hash
        if: env.PREV_HASH != 'none'
        shell: pwsh
        run: |
          $cur = (Get-FileHash 'target/release/DshLauncher.exe' -Algorithm SHA256).Hash
          Write-Host "本次编译产物 SHA256: $cur"
          if ($cur -eq $env:PREV_HASH) {
            Write-Host "产物与上一发布完全一致 (仅注释等非代码改动)，跳过发布"
            "SKIP_RELEASE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "产物有变化，继续发布流程"
          }

      - name: 计算发布版本号 (YY.MM.DD.NN，北京时间当日计数)
        if: env.SKIP_RELEASE != '1'
        shell: pwsh
        run: |
          $d = (Get-Date).ToUniversalTime().AddHours(8).ToString('yy.MM.dd')
          $existing = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          $n = @($existing | Where-Object { $_ -match ('^v' + [regex]::Escape($d) + '\.\d{2}$') }).Count
          $ver = "$d.{0:D2}" -f ($n + 1)
          Write-Host "发布版本: v$ver (当日第 $($n + 1) 次发布)"
          "PUB_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 第二步编译 (正式版本号)
        if: env.SKIP_RELEASE != '1'
        env:
          DSHLAUNCHER_VERSION: ${{ env.PUB_VER }}
        run: cargo build --release

      - name: 发布 Release 并打 tag
        if: env.SKIP_RELEASE != '1'
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:PREV_TAG)) {
            $body = git log --pretty=format:"- %s"
          } else {
            $body = git log "$($env:PREV_TAG)..HEAD" --pretty=format:"- %s"
          }
          $body | Out-File -FilePath 'release-notes.md' -Encoding utf8
          gh release create "v$env:PUB_VER" 'target/release/DshLauncher.exe' --title "v$env:PUB_VER" --notes-file 'release-notes.md'
          if ($LASTEXITCODE -ne 0) { Write-Error "发布失败"; exit 1 }
          Write-Host "已发布 v$env:PUB_VER"
