name: CI

# 仅当影响编译/测试的文件变更时触发；纯文档改动 (README/AGENTS 等) 跳过 CI
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'icons/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'icons/**'
      - '.github/workflows/ci.yml'

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链 (含 rustfmt 与 clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy (警告即失败)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --locked


  # 发布判断改为源码比对：git diff -b 忽略缩进/空白数量变化，
  # 只有影响编译产物的文件发生实质内容变化时才发布
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 定位上一发布版本
        shell: pwsh
        run: |
          $prevTag = (gh release list --limit 1 --json tagName --jq '.[0].tagName') 2>$null
          if ([string]::IsNullOrEmpty($prevTag)) {
            Write-Host "无历史发布：直接进入发布流程"
            "PREV_TAG=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "HAS_PREV=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          Write-Host "上一发布: $prevTag"
          "PREV_TAG=$prevTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HAS_PREV=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 比对源码变化 (忽略缩进/空白数量变化)
        shell: pwsh
        run: |
          if ($env:HAS_PREV -ne '1') {
            Write-Host "无历史发布：直接计算版本并发布"
            exit 0
          }
          $files = @(git diff -b --name-only "$($env:PREV_TAG)..HEAD")
          if ($LASTEXITCODE -ne 0) { Write-Error "git diff 失败"; exit 1 }
          $codeFiles = @($files | Where-Object {
            $_ -match '^(Cargo\.toml|Cargo\.lock|build\.rs|src/|icons/)'
          })
          if ($codeFiles.Count -gt 0) {
            Write-Host "以下编译相关文件存在非缩进变化:"
            $codeFiles | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "编译相关源码无实质变化，跳过发布"
            "SKIP_RELEASE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: 计算发布版本号 (YY.MM.DD.NN，北京时间当日计数)
        if: env.SKIP_RELEASE != '1'
        shell: pwsh
        run: |
          $d = (Get-Date).ToUniversalTime().AddHours(8).ToString('yy.MM.dd')
          $existing = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          $n = @($existing | Where-Object { $_ -match ('^v' + [regex]::Escape($d) + '\.\d{2}$') }).Count
          $ver = "$d.{0:D2}" -f ($n + 1)
          Write-Host "发布版本: v$ver (当日第 $($n + 1) 次发布)"
          "PUB_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 编译正式版本号产物
        if: env.SKIP_RELEASE != '1'
        env:
          DSHLAUNCHER_VERSION: ${{ env.PUB_VER }}
        run: cargo build --release --locked

      - name: 发布 Release 并打 tag
        if: env.SKIP_RELEASE != '1'
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:PREV_TAG)) {
            $body = git log --pretty=format:"- %s"
          } else {
            $body = git log "$($env:PREV_TAG)..HEAD" --pretty=format:"- %s"
          }
          $body | Out-File -FilePath 'release-notes.md' -Encoding utf8
          gh release create "v$env:PUB_VER" 'target/release/DshLauncher.exe' --title "v$env:PUB_VER" --notes-file 'release-notes.md'
          if ($LASTEXITCODE -ne 0) { Write-Error "发布失败"; exit 1 }
          Write-Host "已发布 v$env:PUB_VER"
