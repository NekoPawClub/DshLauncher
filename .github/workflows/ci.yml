name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链（含 rustfmt 与 clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy（警告即失败）
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test
